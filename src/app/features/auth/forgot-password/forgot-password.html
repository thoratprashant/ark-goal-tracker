<div class="login--wrapper d-flex flex-column" data-aos="fade-up">
  <div class="d-flex align-items-center logo">
    <img src="images/logo.svg" alt="img" class="me-2">
    <h2 class="fw-bold m-0">Forgot password</h2>
  </div> 
  <form>
    <div class="row">
      <div class="col-12 mb-4">
        <label  class="form-label">Registered email id  <span  class="text-error">*</span></label>
        <input type="text" class="form-control"   placeholder="Enter registered email ID">
      
      </div>
      <div class="col-12">
        <button type="button" class="btn btn-primary w-100 mb-4" routerLink="/auth/reset-password">Send Verification Code</button> 
      </div>
      <div class="col-12 d-flex mb-3">
        <a class="text-primary" routerLink="/auth/login">Back to login</a>
      </div>
    </div> 
  </form>

</div>
