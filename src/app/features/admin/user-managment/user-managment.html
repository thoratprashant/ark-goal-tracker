<div class="container-fluild um--wrapper">
  <div class="row">
    <div
      class="col-12 head--sec d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between">
      <div class="d-flex flex-column">
        <h4 class="text-secondary fw-bold">User Management</h4>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a routerLink="/admin/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">User Management</li>
          </ol>
        </nav>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-lg btn-outline-primary">
          <i class="icon icon--download"></i>
          Download Sample CSV
        </button>
        <button type="button" class="btn btn-lg btn-outline-primary">
          <i class="icon icon--upload"></i>
          Bulk Upload
        </button>
        <button type="button" class="btn btn-lg btn-primary flex-shrink-0">
          <mat-icon class="text-white" fontSet="material-icons-outlined">person_add</mat-icon>
          Invite User
        </button>
      </div>
    </div>
    <div class="col-12">
      <div class="card flex-row d-flex p-3 p-sm-4 gap-2 mt-2 mt-sm-4">
        <div class="icon--input--box position-relative w-100">
          <input type="text" class="form-control" placeholder="Search users by name or email">
          <mat-icon>search</mat-icon>
        </div>
        <mat-form-field appearance="outline">
          <mat-select placeholder="All Roles">
            <mat-option value="1">System Admin</mat-option>
            <mat-option value="2">District Admin</mat-option>
            <mat-option value="3">Principals</mat-option>
            <mat-option value="4">Teachers</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div class="col-12">
      <div class="card d-flex p-3 p-sm-4 mt-1 mt-sm-2">
        <div class="row">
          <div class="col-12">
            <h5 class="font-15 fw-semibold text-secondary mb-1">Users (1)</h5>
            <p class="clr--7373 font-13 mb-3 mb-sm-4">Manage all system users</p>
          </div>
          <div class="col-12">
            <div class="card d-flex flex-column flex-sm-row justify-content-between p-3 p-sm-4 mb-3"
              *ngFor="let user of users">
              <div class="d-flex align-items-center"> 
                <div class="d-flex align-items-center justify-content-center user--box flex-shrink-0">
                  <img [src]="user.icon" alt="icon" class="img-fluid">
                </div> 
                <div class="d-flex flex-column ms-2">
                  <h6 class="mb-1 font-15 fw-semibold">{{user.name}}</h6>
                  <p class="wb-ba font-13 mb-0">{{user.email}}</p>
                </div> 
              </div>

              <div class="d-flex align-items-center mt-3 mt-sm-0"> 
                <button type="button" class="btn btn-sm btn-primary flex-shrink-0">
                  {{user.role}}
                </button> 
                <button type="button" class="btn btn-light p-1 d-flex ms-2" routerLink="/admin/user-profile">
                  <mat-icon>visibility</mat-icon>
                </button> 
              </div>
            </div>
          </div>
          <div class="col-12">
            <a class="text-primary font-13 clr--7373 mt-2 text-decoration-underline"  (click)="loadMore()">Load more...</a>
          </div>
        </div>
      </div>
    </div>
  
  </div>
</div>
