<div class="container-fluild admin--wrapper">
  <div class="row">
    <div class="col-12 head--sec">
      <h4 class="text-secondary fw-bold">Admin Dashboard</h4>
      <p>Manage users, data, goals, and system settings</p>
    </div>
    @for (card of cards; track card.title) {
    <div class="col-12 col-md-4">
      <div class="card card--box d-flex flex-row align-items-center justify-content-between mb-3">
        <div class="d-flex flex-column">
          <small class="font-12">{{ card.title }}</small>
          <h6 class="my-1 text-secondary fw-bold">{{ card.value }}</h6>
          <p class="m-0 font-13">{{ card.week }}</p>
        </div>
        <div class="card--indicator d-flex align-items-center justify-content-center">
          <img [src]="card.icon" alt="icon" class="img-fluid">
        </div>

      </div>
    </div>
    }
  </div>

  <div class="row">
    <div class="col-12 col-lg-9"></div>
    <div class="col-12 col-lg-3"></div>
  </div>


</div>
